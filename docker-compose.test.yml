services:
  opensearch:
    image: opensearchproject/opensearch:3.0.0
    container_name: opensearch-test
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=MyStr0ng#Pass!2024
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200 -u admin:MyStr0ng#Pass!2024 | grep -q 'cluster_name'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - opensearch-net
    profiles:
      - v3
      - os-both

  opensearch-2x:
    image: opensearchproject/opensearch:2.19.0
    container_name: opensearch-test-2x
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=MyStr0ng#Pass!2024
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data-2x:/usr/share/opensearch/data
    ports:
      - "9201:9200"
      - "9601:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200 -u admin:MyStr0ng#Pass!2024 | grep -q 'cluster_name'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - opensearch-net
    profiles:
      - v2
      - os-both

  # n8n 1.x instance (port 5679)
  n8n-1x:
    image: docker.n8n.io/n8nio/n8n:1.123.7
    container_name: n8n-test-1x
    ports:
      - "5679:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=development
      - N8N_LOG_LEVEL=debug
    volumes:
      - n8n-data-1x:/home/node/.n8n
      - .:/home/node/.n8n/custom/node_modules/n8n-nodes-opensearch:ro
    networks:
      - opensearch-net
    profiles:
      - n8n-1x
      - n8n-both

  # n8n 2.x instance (port 5678)
  n8n-2x:
    image: docker.n8n.io/n8nio/n8n:2.1.0
    container_name: n8n-test-2x
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=development
      - N8N_LOG_LEVEL=debug
    volumes:
      - n8n-data-2x:/home/node/.n8n
      - .:/home/node/.n8n/custom/node_modules/n8n-nodes-opensearch:ro
    networks:
      - opensearch-net
    profiles:
      - n8n-2x
      - n8n-both

  # OpenSearch Dashboards (optional, for debugging)
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.0.0
    container_name: opensearch-dashboards-test
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - opensearch.ssl.verificationMode=none
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - opensearch-net
    profiles:
      - dashboards

volumes:
  opensearch-data:
  opensearch-data-2x:
  n8n-data-1x:
  n8n-data-2x:

networks:
  opensearch-net:
