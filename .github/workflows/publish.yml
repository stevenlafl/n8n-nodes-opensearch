name: Publish

# Publishes to npm when a commit on master changes the version in package.json to one that
# npm does not have yet, then tags the commit and mirrors the package to GitHub Packages so it
# shows up in the repository sidebar with a link.
#
# npm auth: add this repository and workflow (publish.yml) as a Trusted Publisher on
# npmjs.com for n8n-nodes-opensearch, or set an NPM_TOKEN repository secret as a fallback.
# Either way the publish carries a provenance attestation, which n8n requires for community
# nodes published after May 2026.

on:
  push:
    branches: [master, main]
    paths: [package.json]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org

      - name: Check whether the version is new
        id: version
        run: |
          version=$(jq -r .version package.json)
          published=$(npm view "$(jq -r .name package.json)@$version" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "$version is already on npm, nothing to publish"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.new == 'true'
        run: pnpm install

      - name: Lint, build and test
        if: steps.version.outputs.new == 'true'
        run: |
          pnpm lint
          pnpm build
          pnpm test:unit

      - name: Publish to npm
        if: steps.version.outputs.new == 'true'
        # npm >= 11.5 is needed for trusted publishing (OIDC). NPM_TOKEN, when set, takes precedence.
        # RELEASE_MODE lets the prepublishOnly hook (n8n-node prerelease) through.
        run: |
          npm install -g npm@latest
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: 'true'

      - name: Tag the release
        if: steps.version.outputs.new == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Mirror to GitHub Packages
        if: steps.version.outputs.new == 'true'
        # GitHub Packages only accepts packages scoped to the repository owner, so the mirror is
        # published as @stevenlafl/n8n-nodes-opensearch. The npm package name does not change.
        run: |
          mkdir -p /tmp/ghp && tar -xzf "$(pnpm pack --pack-destination /tmp | tail -1)" -C /tmp/ghp --strip-components=1
          cd /tmp/ghp
          jq '.name = "@" + env.GITHUB_REPOSITORY_OWNER + "/" + .name' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" > .npmrc
          npm publish --registry=https://npm.pkg.github.com --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
